name = "video-subtitle-translator"
main = "src/index.ts"
compatibility_date = "2024-12-16"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding
[ai]
binding = "AI"

# R2 bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "video-subtitle-bucket"
preview_bucket_name = "video-subtitle-bucket-preview"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "video-subtitle-db"
database_id = "324af083-cdab-450a-9967-db8045c67cb6"

# Routes configuration for custom domain
[[routes]]
pattern = "subtitle.myzhangyujie.com/*"
zone_name = "myzhangyujie.com"

[[routes]]
pattern = "www.subtitle.myzhangyujie.com/*"
zone_name = "myzhangyujie.com"

# Environment configuration
[env.production]
vars = { ENVIRONMENT = "production", EMAIL_FROM = "noreply@subtitle.myzhangyujie.com" }

[env.development]
vars = { ENVIRONMENT = "development", EMAIL_FROM = "dev@subtitle.myzhangyujie.com" }

[build]
command = "npm run build"
cwd = "./"
